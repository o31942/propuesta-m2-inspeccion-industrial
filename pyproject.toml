[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sistema-inspeccion-industrial"
version = "0.1.0"
description = "Sistema modular desacoplado de inspección de calidad industrial para detección de defectos superficiales en acero laminado (NEU-DET) con YOLOv8/RT-DETR, XAI y Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Equipo M2 — Maestría en IA y Ciencia de Datos (UAO)", email = "estudiante@uao.edu.co" }
]
keywords = ["computer-vision", "surface-defect-detection", "neu-det", "yolov8", "quality-inspection", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26.0",
    "pydicom>=2.4.4",
    "opencv-python-headless>=4.8.0.76",
    "pillow>=10.2.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.35.0",
    "tensorflow-cpu>=2.15.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sistema_inspeccion_industrial"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # Sintaxis y estilo (pycodestyle)
    "F",   # Variables no usadas (Pyflakes)
    "I",   # Orden de imports (isort)
    "B",   # Bugs comunes (flake8-bugbear)
]
ignore = [
    "E501", # Longitud de línea
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
